<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<style>
  body {
    margin: 0; padding: 14px; font: 12px/1.45 Inter, -apple-system, "Segoe UI", sans-serif;
    color: var(--figma-color-text, #222); background: var(--figma-color-bg, #fff);
  }
  h1 { font-size: 14px; margin: 0 0 4px; }
  .muted { color: var(--figma-color-text-secondary, #777); }
  .frames { margin: 10px 0; border: 1px solid var(--figma-color-border, #e5e5e5); border-radius: 6px; max-height: 150px; overflow: auto; }
  .frame { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--figma-color-border, #eee); }
  .frame:last-child { border-bottom: none; }
  .empty { padding: 12px 10px; text-align: center; }
  button {
    font: inherit; border-radius: 6px; padding: 7px 12px; cursor: pointer; border: 1px solid var(--figma-color-border, #ccc);
    background: var(--figma-color-bg-secondary, #f5f5f5); color: inherit;
  }
  button.primary { background: var(--figma-color-bg-brand, #0d99ff); color: var(--figma-color-text-onbrand, #fff); border-color: transparent; width: 100%; font-weight: 600; }
  button:disabled { opacity: 0.45; cursor: default; }
  .row { display: flex; gap: 6px; margin-top: 8px; }
  .row button { flex: 1; }
  .status { margin-top: 10px; min-height: 18px; }
  .ok { color: var(--figma-color-text-success, #14ae5c); }
  .err { color: var(--figma-color-text-danger, #f24822); }
  ul { margin: 6px 0 0; padding-left: 18px; }
  .hint { margin-top: 12px; font-size: 11px; }
  code { background: var(--figma-color-bg-secondary, #f2f2f2); padding: 0 3px; border-radius: 3px; }
</style>
</head>
<body>
  <h1>Exportar a Raxorin Studio</h1>
  <div class="muted">Selecciona una o más pantallas (frames) y expórtalas. En Raxorin Studio: diseñador → <strong>Importar de Figma</strong>.</div>

  <div class="frames" id="frames"><div class="empty muted">Nada seleccionado</div></div>

  <button class="primary" id="export" disabled>Exportar</button>
  <div class="row" id="after" hidden>
    <button id="download">Descargar .json</button>
    <button id="copy">Copiar</button>
  </div>
  <div class="status" id="status"></div>

  <div class="hint muted">
    Consejo: usa <strong>Auto Layout</strong> y nombra los componentes <code>Button</code>, <code>Input</code>,
    <code>Checkbox</code>, <code>Switch</code>… para que se conviertan en controles reales.
  </div>

<script>
  var result = null;
  var $ = function (id) { return document.getElementById(id); };

  function setStatus(html, cls) {
    $("status").className = "status " + (cls || "");
    $("status").innerHTML = html;
  }

  function download() {
    var blob = new Blob([result.json], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = result.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function copy() {
    var area = document.createElement("textarea");
    area.value = result.json;
    document.body.appendChild(area);
    area.select();
    var ok = document.execCommand("copy");
    area.remove();
    parent.postMessage({ pluginMessage: { type: "notify", message: ok ? "Copiado: pégalo en Raxorin Studio" : "No se pudo copiar" } }, "*");
  }

  $("export").onclick = function () {
    $("export").disabled = true;
    $("after").hidden = true;
    setStatus("Exportando…");
    parent.postMessage({ pluginMessage: { type: "export" } }, "*");
  };
  $("download").onclick = download;
  $("copy").onclick = copy;

  onmessage = function (event) {
    var msg = event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === "selection") {
      result = null;
      $("after").hidden = true;
      setStatus("");
      $("export").disabled = msg.frames.length === 0;
      $("frames").innerHTML = msg.frames.length
        ? msg.frames.map(function (f) {
            return '<div class="frame"><span>' + f.name.replace(/</g, "&lt;") + '</span><span class="muted">' + f.w + "×" + f.h + "</span></div>";
          }).join("")
        : '<div class="empty muted">Nada seleccionado</div>';
    } else if (msg.type === "progress") {
      setStatus("Exportando imágenes… (" + msg.images + ")");
    } else if (msg.type === "result") {
      result = msg;
      $("export").disabled = false;
      $("after").hidden = false;
      var warn = msg.warnings.length ? "<ul class='muted'>" + msg.warnings.map(function (w) { return "<li>" + w + "</li>"; }).join("") + "</ul>" : "";
      setStatus("✓ " + msg.frames + " pantalla(s), " + msg.images + " imagen(es), " + msg.variables + " color(es) del sistema de diseño." + warn, "ok");
      download();
    } else if (msg.type === "error") {
      $("export").disabled = false;
      setStatus(msg.message, "err");
    }
  };
</script>
</body>
</html>
